<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <style>
    .bg { fill: #0d121a; }
    .chrome { fill: #151c28; }
    .t { fill: #c7d2e4; font-size: 12.5px; }
    .dim { fill: #7d8a9e; }
    .num { fill: #f0f3f8; font-weight: 600; }
    .head { fill: #ffffff; font-size: 14px; font-weight: 700; }
    .cc { fill: #d6744a; }
    .cx { fill: #2ec7b6; }
    .ki { fill: #fa9e1c; }
    .prompt { fill: #57d98a; }
    .warn { fill: #f1cd7e; }
    tspan.k { fill: #9aa7bd; }
    g.line { opacity: 0; }
    g.line animate { }
  </style>

  <rect class="bg" width="760" height="452" rx="10"/>
  <rect class="chrome" width="760" height="30" rx="10"/>
  <rect class="chrome" y="20" width="760" height="10"/>
  <circle cx="18" cy="15" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="15" r="5" fill="#febc2e"/>
  <circle cx="54" cy="15" r="5" fill="#28c840"/>
  <text x="380" y="19.5" class="t dim" font-size="11" text-anchor="middle">ctxmeter</text>

  <!-- Each line fades in on a stagger so the output reads as if it were streaming. -->
  <g class="line">
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.15s" fill="freeze"/>
    <text x="20" y="56" class="t"><tspan class="prompt">$</tspan> npx ctxmeter</text>
  </g>

  <g class="line">
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.2s" fill="freeze"/>
    <text x="20" y="84" class="head">Your agent setup costs <tspan fill="#ff8a6b">34,394 tokens</tspan> before you type anything.</text>
  </g>

  <g class="line">
    <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.15s" fill="freeze"/>
    <text x="20" y="114" class="t"><tspan class="cx" font-weight="700">Codex</tspan>: <tspan class="num">19,779 tokens</tspan><tspan class="dim"> — 7.7% of 258,400</tspan></text>
  </g>
  <g class="line">
    <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.15s" fill="freeze"/>
    <text x="20" y="133" class="t"><tspan class="num">     16,948</tspan>  MCP tool schemas</text>
    <text x="20" y="150" class="t dim">             49 tools across 3 servers; largest obsidian at 8,526</text>
  </g>
  <g class="line">
    <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.15s" fill="freeze"/>
    <text x="20" y="169" class="t"><tspan class="num">      2,245</tspan>  Skill metadata listed at startup</text>
    <text x="20" y="186" class="t dim">             18 skills; largest group user-and-system-skills</text>
  </g>
  <g class="line">
    <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.15s" fill="freeze"/>
    <text x="20" y="205" class="t"><tspan class="num">        586</tspan>  Global instructions<tspan class="dim">   AGENTS.md</tspan></text>
  </g>

  <g class="line">
    <animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.15s" fill="freeze"/>
    <text x="20" y="235" class="t"><tspan class="cc" font-weight="700">Claude Code</tspan>: <tspan class="num">10,545 tokens</tspan><tspan class="dim"> — 1.1% of 1,000,000</tspan></text>
  </g>
  <g class="line">
    <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.15s" fill="freeze"/>
    <text x="20" y="254" class="t"><tspan class="num">      5,728</tspan>  Skill metadata listed at startup</text>
    <text x="20" y="271" class="t dim">             35 skills; largest group user-skills at 3,268</text>
  </g>
  <g class="line">
    <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.15s" fill="freeze"/>
    <text x="20" y="290" class="t"><tspan class="num">      2,952</tspan>  Global instructions and rules</text>
    <text x="20" y="307" class="t dim">             CLAUDE.md + 6 rule files</text>
  </g>
  <g class="line">
    <animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.15s" fill="freeze"/>
    <text x="20" y="326" class="t"><tspan class="num">      1,865</tspan>  MCP tool schemas<tspan class="dim">   2 tools across 1 server</tspan></text>
  </g>

  <g class="line">
    <animate attributeName="opacity" from="0" to="1" begin="3.3s" dur="0.15s" fill="freeze"/>
    <text x="20" y="356" class="t"><tspan class="ki" font-weight="700">Kiro</tspan>: <tspan class="num">4,070 tokens</tspan><tspan class="dim"> — 0.4% of 1,000,000</tspan></text>
  </g>
  <g class="line">
    <animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.15s" fill="freeze"/>
    <text x="20" y="375" class="t"><tspan class="num">      2,275</tspan>  Steering documents<tspan class="dim">   6 steering files</tspan></text>
  </g>
  <g class="line">
    <animate attributeName="opacity" from="0" to="1" begin="3.7s" dur="0.15s" fill="freeze"/>
    <text x="20" y="394" class="t"><tspan class="num">      1,795</tspan>  Skill metadata<tspan class="dim">   13 skills</tspan></text>
  </g>

  <g class="line">
    <animate attributeName="opacity" from="0" to="1" begin="4.2s" dur="0.3s" fill="freeze"/>
    <text x="20" y="424" class="t dim" font-size="11.5">Read-only. Nothing leaves your machine. Static figures are bytes ÷ 4.</text>
    <text x="20" y="441" class="t dim" font-size="11.5">MCP schemas measured by starting each server on request, then discarded.</text>
  </g>
</svg>

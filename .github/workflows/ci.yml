name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor (node:sqlite unflagged in 22.13) and the current LTS.
        node: ['22.13', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
        env:
          # Set only on a tag push; the version test then checks the tag too.
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      - name: Audit runs on a machine with no agent configuration
        run: node src/cli.js audit --home "$(mktemp -d)"
      - name: The packed tarball installs and runs
        run: ./scripts/verify-package.sh

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift build -c release
        working-directory: menubar
      - run: swift test
        working-directory: menubar
